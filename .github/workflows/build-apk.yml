name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project and restore 3D model
        run: |
          unzip -o Anatomy-RU-project-v0.7.0-code.zip -d project
          cat SkeletalSystem100.glb.part1 SkeletalSystem100.glb.part2 > model.zip
          mkdir -p project/Anatomy-RU/app/src/main/assets
          unzip -o model.zip -d project/Anatomy-RU/app/src/main/assets
          ls -lh project/Anatomy-RU/app/src/main/assets/SkeletalSystem100.glb

      - name: Show MainActivity around error
        run: |
          echo "=== MainActivity.kt lines 220-245 ==="
          nl -ba project/Anatomy-RU/app/src/main/java/ru/tsaeasar/anatomy/MainActivity.kt | sed -n '220,245p'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fix JVM target
        working-directory: project/Anatomy-RU
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  'android { namespace = "ru.tsaesar.anatomy"; compileSdk = 35',
                  '''android {
                  namespace = "ru.tsaesar.anatomy"
                  compileSdk = 35

                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = "17"
                  }'''
              )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: project/Anatomy-RU
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anatomy-RU-debug-apk-v0.7.0
          path: project/Anatomy-RU/app/build/outputs/apk/debug/app-debug.apk
