name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show MainActivity
        run: |
          nl -ba project/Anatomy-RU/app/src/main/java/ru/tsaeasar/anatomy/MainActivity.kt | sed -n '100,130p'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fix JVM target
        working-directory: project/Anatomy-RU
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Fix Java/Kotlin JVM target
          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'android { namespace = "ru.tsaesar.anatomy"; compileSdk = 35',
              '''android {
                  namespace = "ru.tsaesar.anatomy"
                  compileSdk = 35

                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = "17"
                  }'''
          )

          p.write_text(s)

          # Opt in to experimental Material 3 API
          p = Path("app/src/main/java/ru/tsaeasar/anatomy/MainActivity.kt")
          s = p.read_text()

          if "ExperimentalMaterial3Api" not in s:
              s = '@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n' + s

          p.write_text(s)
          PY


      - name: Build APK
        working-directory: project/Anatomy-RU
        run: gradle assembleDebug --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anatomy-RU-debug-apk
          path: project/Anatomy-RU/app/build/outputs/apk/debug/app-debug.apk
